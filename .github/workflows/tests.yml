name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: xcrun clang -fobjc-arc -fblocks -fno-modules -fsyntax-only -framework Cocoa app/Patcher.m
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts linkedom@0.18.12
      - run: |
          mkdir -p work
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'tools/sumerki'); from build_patch import manager_script; Path('work/manager-bundled.js').write_text(manager_script(Path('manager/manager.js'),Path('tools/sumerki/theme.css').read_text()))"
          node tests/run-manager.mjs
